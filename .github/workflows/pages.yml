name: Publish student app
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write public API endpoint
        env:
          PILDAM_API_BASE: ${{ vars.PILDAM_API_BASE }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          endpoint=os.environ.get('PILDAM_API_BASE','').rstrip('/')
          if not re.fullmatch(r'https://[a-z0-9-]+\.supabase\.co/functions/v1/pildam',endpoint):
              raise SystemExit('Set repository variable PILDAM_API_BASE to the deployed Supabase function URL.')
          page=Path('dist/index.html')
          page.write_text(page.read_text().replace('/* PILDAM_DEPLOY_CONFIG */','window.PILDAM_CONFIG = '+json.dumps({'apiBase':endpoint})+';'))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
